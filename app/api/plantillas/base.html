<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Foro y resenas{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; line-height: 1.5; }
    header { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
    header a { text-decoration: none; }
    .tarjeta { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; }
    .rechazado { border-left: 4px solid #b00020; background: #fff5f5; }
    .publicado { border-left: 4px solid #1b7f3b; }
    .meta { color: #666; font-size: 0.85rem; }
    label { display: block; margin-top: 8px; }
    input, textarea, select { width: 100%; padding: 6px; }
    button { margin-top: 10px; padding: 8px 14px; cursor: pointer; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <strong><a href="/">Foro y resenas</a></strong>
    {% if usuario %}
      <span class="meta">{{ usuario.nombre }}</span>
      <a href="/mis-publicaciones">Mis publicaciones</a>
      <form action="/salir" method="post" style="margin:0"><button type="submit">Salir</button></form>
    {% else %}
      <a href="/entrar">Entrar</a>
      <a href="/registro">Registrarme</a>
    {% endif %}
  </header>
  {% block contenido %}{% endblock %}
</body>
</html>

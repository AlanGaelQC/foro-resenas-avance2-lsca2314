{% extends "base.html" %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<div class="tarjeta panel-acceso">
  <h1>Crear cuenta</h1>
  <p class="meta">Comparte tus experiencias con la comunidad.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form action="/registro" method="post">
    <label for="correo">Correo</label><input id="correo" type="email" name="correo" required autocomplete="email">
    <label for="nombre">Nombre</label><input id="nombre" type="text" name="nombre" required maxlength="80" autocomplete="name">
    <label for="contrasena">Contrasena (minimo 10 caracteres)</label>
    <input id="contrasena" type="password" name="contrasena" required minlength="10" autocomplete="new-password">
    <button type="submit">Registrarme</button>
  </form>
  <p class="meta">¿Ya tienes cuenta? <a href="/entrar">Entrar</a></p>
</div>
{% endblock %}
